<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SYSHHB IT Helpdesk System</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0E3B22">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Helpdesk">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;--f-body:"Public Sans","Segoe UI",system-ui,sans-serif;
--bg:#F0F4EC;--surface:#FFFFFF;--surface2:#E6EDE0;--line:#D6DBC9;--text:#13241A;--muted:#55665A;--gold:#A89464;
--brand:#1D8A3A;--brand-ink:#FFFFFF;--sun:#7C6A2E;--moon:#1A7A38;
--nav:#0E3B22;--nav-text:#C3DCC8;--nav-active:#175131;
--s-open:#BE3B2A;--s-progress:#2160C4;--s-hold:#9A6A00;--s-resolved:#247A4C;--s-closed:#5F6E7E;
color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--bg:#0B1810;--surface:#12251A;--surface2:#1A3324;--line:#2A4533;--text:#E5F0E6;--muted:#97AE9C;--gold:#B7A471;
--brand:#4CC864;--brand-ink:#05200E;--sun:#F3E35B;--moon:#8FE3A3;--nav:#07120B;--nav-text:#A9C7B0;--nav-active:#123222;
--s-open:#F0735F;--s-progress:#6FA2F5;--s-hold:#E3A93C;--s-resolved:#52C185;--s-closed:#9AA9B8;color-scheme:dark}}
:root[data-theme="dark"]{
--bg:#0B1810;--surface:#12251A;--surface2:#1A3324;--line:#2A4533;--text:#E5F0E6;--muted:#97AE9C;--gold:#B7A471;
--brand:#4CC864;--brand-ink:#05200E;--sun:#F3E35B;--moon:#8FE3A3;--nav:#07120B;--nav-text:#A9C7B0;--nav-active:#123222;
--s-open:#F0735F;--s-progress:#6FA2F5;--s-hold:#E3A93C;--s-resolved:#52C185;--s-closed:#9AA9B8;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:40}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.01em;line-height:1.15}
h1{font-size:1.7rem;font-weight:700}h2{font-size:1.1rem;font-weight:650}
p{margin:0}button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
textarea{resize:vertical;min-height:84px}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.muted{color:var(--muted)}.small{font-size:.86rem}
.link{background:none;border:0;padding:0;color:var(--brand);font-weight:600;text-decoration:underline;text-underline-offset:3px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{padding:5px 10px;font-size:.86rem}.btn.wide{width:100%}
.btn[disabled]{opacity:.55;cursor:default}
.icon-btn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;border:0;background:transparent;position:relative}
.icon-btn:hover{background:var(--surface2)}

/* pills */
.pill{--c:var(--s-open);display:inline-block;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border-radius:999px;padding:2px 10px;font-size:.82rem;font-weight:650;white-space:nowrap}
.s-open{--c:var(--s-open)}.s-progress{--c:var(--s-progress)}.s-hold{--c:var(--s-hold)}.s-resolved{--c:var(--s-resolved)}.s-closed{--c:var(--s-closed)}
.prio{--c:var(--s-closed);display:inline-flex;align-items:center;gap:6px;font-size:.84rem;white-space:nowrap}
.prio b{display:inline-flex;gap:2px;align-items:flex-end}
.prio i{width:3px;background:var(--line);border-radius:1px}
.prio i:nth-child(1){height:5px}.prio i:nth-child(2){height:7px}.prio i:nth-child(3){height:9px}.prio i:nth-child(4){height:11px}
.l1 i:nth-child(-n+1),.l2 i:nth-child(-n+2),.l3 i:nth-child(-n+3),.l4 i:nth-child(-n+4){background:var(--c)}
.l3{--c:var(--s-hold)}.l4{--c:var(--s-open)}.l2{--c:var(--s-progress)}
.dd{display:inline-flex;flex-direction:column;line-height:1.25}
.dd-h{font-size:.84em;color:var(--moon)}

/* auth */
.auth{min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:1.05fr 1fr}
.hero{position:relative;isolation:isolate;overflow:hidden;background:linear-gradient(160deg,#17862F 0%,#25A241 100%);color:#fff;padding:48px clamp(24px,5vw,72px);display:flex;flex-direction:column;justify-content:space-between;gap:40px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:1.2rem}
.brand .mark{width:38px;height:38px;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden;border:2px solid var(--gold);flex:none}
.brand .mark img{width:100%;height:100%;object-fit:contain;display:block}
.twin{display:grid;grid-template-columns:1fr 1px 1fr;gap:clamp(16px,3vw,40px);align-items:stretch}
.twin hr{border:0;background:rgba(255,255,255,.4);margin:0}
.twin-col{display:flex;flex-direction:column;gap:2px}
.twin .num{font-family:var(--f-display);font-weight:800;font-size:clamp(4.2rem,11vw,8rem);line-height:.9;letter-spacing:-.04em;color:#FFF23A}
.twin .hij .num{color:#FFFFFF}
.twin .lab{font-size:1.05rem;font-weight:600;margin-top:10px}
.twin .tag{color:#E3F4D8;font-size:.9rem}
.hero p.lead{max-width:36ch;color:#F0FAE8;font-size:1.02rem}
.hero>*{position:relative;z-index:1}
.hero::after{content:"";position:absolute;inset:18px;background:var(--logo) center/contain no-repeat;mix-blend-mode:multiply;opacity:.3;pointer-events:none}
.auth-side{display:grid;place-items:center;padding:32px 20px}
.auth-card{width:min(420px,100%);display:flex;flex-direction:column;gap:20px}
.tabs{display:flex;gap:4px;background:var(--surface2);border-radius:10px;padding:4px}
.tabs button{flex:1;border:0;background:transparent;border-radius:7px;padding:8px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.stack{display:flex;flex-direction:column;gap:14px}
.fld{display:flex;flex-direction:column;gap:5px;font-size:.9rem;font-weight:600}
.fld>span{color:var(--muted);font-weight:600}
.fld small{font-weight:400;color:var(--muted)}
.err{background:color-mix(in srgb,var(--s-open) 12%,transparent);color:var(--s-open);border-radius:8px;padding:9px 12px;font-size:.9rem}
.note{background:color-mix(in srgb,var(--s-hold) 13%,transparent);color:var(--text);border-left:3px solid var(--s-hold);border-radius:6px;padding:9px 12px;font-size:.9rem}

/* shell */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.nav{background:var(--nav);color:var(--nav-text);position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));padding:20px 12px;display:flex;flex-direction:column;gap:4px}
.nav .brand{color:#fff;padding:0 8px 18px}
.nav button.nv{display:flex;align-items:center;gap:11px;border:0;background:transparent;color:inherit;padding:10px 12px;border-radius:9px;text-align:left;font-weight:550}
.nav button.nv:hover{background:var(--nav-active)}
.nav button.nv.on{background:var(--nav-active);color:#fff;box-shadow:inset 3px 0 0 #FFF23A}
.nav .sp{flex:1}
.nav .who{padding:10px 12px;font-size:.86rem;color:#A8C4AE;border-top:1px solid rgba(255,255,255,.12)}
.nav .who b{display:block;color:#E7EFF7;font-size:.94rem}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:2px solid var(--gold);display:flex;align-items:center;gap:10px;padding:8px 20px;min-height:58px}
.top h1{font-size:1.15rem;flex:1}
.today{display:flex;gap:14px;align-items:center;font-size:.86rem;line-height:1.2}
.today span{display:flex;align-items:center;gap:6px;white-space:nowrap}
.today .sun{color:var(--sun)}.today .moon{color:var(--moon)}
.badge{position:absolute;top:1px;right:0;min-width:18px;height:18px;border-radius:9px;background:var(--s-open);color:#fff;font-size:.72rem;font-weight:700;display:grid;place-items:center;padding:0 4px}
.bellwrap{position:relative}
.bellpanel{position:absolute;right:0;top:44px;width:min(380px,calc(100vw - 24px));max-height:70vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.22);z-index:50}
.bellpanel header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.nt{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:11px 14px}
.nt:hover{background:var(--surface2)}
.nt.un{background:color-mix(in srgb,var(--brand) 9%,transparent)}
.nt small{display:block;color:var(--muted)}
.content{padding:24px clamp(16px,3vw,32px) 48px;max-width:1240px;width:100%}
.page-h{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:18px}
.crumb{margin-bottom:14px}

/* generic blocks */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.panel>h2{margin-bottom:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.mt{margin-top:16px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);margin-bottom:4px}

/* dashboard */
.strip{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.strip-bar{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--surface2);gap:2px}
.strip-bar i{display:block;height:100%}
.strip-leg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:14px}
.stat{display:flex;flex-direction:column;align-items:flex-start;gap:0;border:1px solid transparent;border-radius:10px;background:transparent;padding:8px 10px;text-align:left}
.stat:hover{background:var(--surface2)}
.stat b{font-family:var(--f-display);font-size:2rem;line-height:1.1;font-weight:700}
.stat span{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:.88rem}
.stat span i{width:9px;height:9px;border-radius:50%}
.attn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:11px 2px;text-align:left}
.attn:last-child{border-bottom:0}
.attn b{font-family:var(--f-display);font-size:1.4rem}
.attn.hot b{color:var(--s-open)}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:130px 1fr 28px;align-items:center;gap:10px;font-size:.88rem}
.bar .tr{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:4px;background:var(--brand)}
.bar span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar b{text-align:right}
.legend{display:flex;gap:16px;font-size:.84rem;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
svg.chart text{fill:var(--muted);font-size:9px;font-family:var(--f-body)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.kpi b{font-family:var(--f-display);font-size:1.6rem;display:block;line-height:1.1}
.kpi span{color:var(--muted);font-size:.86rem}

/* ticket list */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters .q{flex:1;min-width:180px}
.filters select{width:auto}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.88rem;font-weight:550}
.chip.on{background:var(--text);color:var(--surface);border-color:var(--text)}
.chk{display:flex;align-items:center;gap:6px;font-size:.88rem}.chk input{width:auto}
.tlist{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.trow{display:grid;grid-template-columns:136px minmax(0,1fr) 108px 96px 140px 128px;gap:12px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:12px 16px}
.trow:last-child{border-bottom:0}
.trow:hover{background:var(--surface2)}
.tid{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.84rem}
.ttl strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ttl small{color:var(--muted)}
.tasg{font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.over{color:var(--s-open);font-weight:600;font-size:.8rem}

/* ticket detail */
.tdetail{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}
.thead{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.thead .meta-line{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.tdesc{white-space:pre-wrap;line-height:1.6}
.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 20px;margin:0}
.meta dt{color:var(--muted);font-size:.84rem}.meta dd{margin:0;font-weight:550}
.progress{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;margin-top:6px}
.progress i{display:block;height:100%;background:var(--s-progress)}
.thread{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.ev{display:flex;gap:10px;align-items:baseline;color:var(--muted);font-size:.88rem}
.ev::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--line);flex:none;transform:translateY(-1px)}
.cm{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface)}
.cm.staff{border-left:3px solid var(--brand)}
.cm.int{background:color-mix(in srgb,var(--s-hold) 11%,transparent);border-color:color-mix(in srgb,var(--s-hold) 45%,transparent)}
.cm header{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:6px;font-size:.88rem}
.cm header b{font-weight:650}
.cm p{white-space:pre-wrap}
.who-tag{color:var(--muted);font-weight:500}
.upd{display:flex;flex-direction:column;gap:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px)}
.upd output{font-weight:700;color:var(--text);margin-left:6px}
.upd input[type=range]{padding:0;border:0;background:transparent;accent-color:var(--brand)}
.hint{color:var(--moon);font-size:.84rem;font-weight:500}
.seg{display:flex;gap:6px;flex-wrap:wrap;border:0;padding:0;margin:0}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer}
.seg span{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-weight:600;background:var(--surface)}
.seg input:checked+span{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand);background:color-mix(in srgb,var(--brand) 10%,transparent)}
.seg input:focus-visible+span{outline:2px solid var(--brand);outline-offset:2px}
.form{max-width:680px}

/* calendar */
.calbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.calbar .ttl2{flex:1;min-width:200px}
.calbar .ttl2 h2{font-size:1.5rem}
.calbar .ttl2 span{color:var(--moon);font-weight:600}
.callayout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cal .wd,.cal .days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal .wd div{padding:8px 0;text-align:center;font-size:.84rem;color:var(--muted);border-bottom:1px solid var(--line);font-weight:600}
.cell{position:relative;min-height:84px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:transparent;padding:8px;text-align:left;display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.cell:nth-child(7n){border-right:0}
.cell b{font-family:var(--f-display);font-size:1.25rem;font-weight:650;line-height:1}
.cell small{color:var(--moon);font-size:.78rem}
.cal.hmode .cell b{color:var(--moon)}.cal.hmode .cell small{color:var(--muted)}
.cell.out{opacity:.4}
.cell:hover{background:var(--surface2)}
.cell.istoday b{background:var(--brand);color:var(--brand-ink);border-radius:6px;padding:2px 6px;margin:-2px -4px}
.cell.sel{box-shadow:inset 0 0 0 2px var(--brand)}
.dots{margin-top:auto;display:flex;gap:4px;align-items:center;font-size:.76rem;color:var(--muted)}
.dots i{width:8px;height:8px;border-radius:50%}
.dots .d-c{background:var(--s-progress)}
.dots .d-d{border:2px solid var(--sun);width:9px;height:9px}
.dots em{font-style:normal;font-weight:700}
.dayrow{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:10px 0}
.dayrow:last-child{border-bottom:0}
.dayrow small{color:var(--muted);display:block}

/* audit & accounts */
.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th{text-align:left;color:var(--muted);font-weight:600;font-size:.84rem;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
.act{display:inline-block;border-radius:6px;padding:1px 8px;background:var(--surface2);font-size:.82rem;font-weight:600;white-space:nowrap}
.act.bad{background:color-mix(in srgb,var(--s-open) 14%,transparent);color:var(--s-open)}

/* toasts */
#toasts{position:fixed;right:14px;top:calc(env(safe-area-inset-top,0px) + 66px);display:flex;flex-direction:column;gap:8px;z-index:60;width:min(360px,calc(100vw - 28px))}
.toast{text-align:left;border:1px solid var(--line);border-left:4px solid var(--brand);background:var(--surface);color:var(--text);border-radius:10px;padding:11px 14px;box-shadow:0 10px 30px rgba(0,0,0,.2);animation:tin .22s ease-out}
.toast.warn{border-left-color:var(--s-hold)}.toast.bad{border-left-color:var(--s-open)}.toast.new{border-left-color:var(--s-open)}
@keyframes tin{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}

.acctlayout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
[hidden]{display:none!important}
.fab,.actbar,.grab,.sheet-bd{display:none}
.content.enter{animation:fadein .18s ease-out}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes slp{from{transform:translateX(-24px);opacity:.3}to{transform:none;opacity:1}}
@keyframes sln{from{transform:translateX(24px);opacity:.3}to{transform:none;opacity:1}}
.cal.sl-p{animation:slp .22s ease-out}.cal.sl-n{animation:sln .22s ease-out}
.cm.me{background:color-mix(in srgb,var(--brand) 8%,var(--surface))}
@media (prefers-reduced-motion:reduce){.content.enter,.cal.sl-p,.cal.sl-n,.sheet.open,.bellpanel,.sheet-bd{animation:none!important}}

.switch input:checked+.sl{background:var(--brand)}
.switch input:checked+.sl::after{transform:translateX(18px)}
.switch input:focus-visible+.sl{outline:2px solid var(--brand);outline-offset:2px}
.crow .send{margin-left:auto;min-width:64px}
.acttabs{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 8px 0 4px;border-bottom:1px solid var(--line)}
.acttabs [role=tablist]{display:flex;gap:2px;overflow-x:auto}
.acttabs [role=tab]{border:0;background:none;padding:12px 10px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.acttabs [role=tab].on{color:var(--text);border-bottom-color:var(--text)}
.acttabs .n{font-size:.75rem;color:var(--muted);font-weight:500}
.alist{list-style:none;margin:0;padding:10px;display:flex;flex-direction:column;gap:8px}
.ai{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;padding:12px;border-radius:10px}
.ev2{background:var(--surface2)}
.cm2.int{background:color-mix(in srgb,var(--s-hold) 12%,transparent)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:.95rem;overflow:hidden}
.av-logo{background:#fff;border:1px solid var(--line)}.av-logo img{width:100%;height:100%;object-fit:contain}
.ah{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.ah time{color:var(--muted);font-size:.85rem}
.ah .tag{font-size:.72rem;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.ah .tag.int{background:color-mix(in srgb,var(--s-hold) 22%,transparent);color:var(--s-hold)}
.ev-s{color:var(--muted);margin-top:2px}.ev-s b{color:var(--text)}
.ct{white-space:pre-wrap;margin-top:4px;line-height:1.55;overflow-wrap:anywhere}
.alist .ai,.alist .ai p,.alist .ai div{white-space:normal}
.alist .ai .ct{white-space:pre-wrap}
.alist .ev2{background:color-mix(in srgb,var(--text) 5%,transparent)}
.trow.has-new{box-shadow:0 0 0 2px color-mix(in srgb,var(--s-open) 60%,transparent)}
.nbadge{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:800;color:#fff;background:var(--s-open);border-radius:999px;padding:2px 10px;margin-bottom:6px;width:max-content;letter-spacing:.02em}
.nbadge i{width:7px;height:7px;border-radius:50%;background:#fff;animation:nbpulse 1.4s infinite}
@keyframes nbpulse{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.nbadge i{animation:none}}
.nsnip{display:block;margin-top:6px;padding:6px 10px;border-left:3px solid var(--s-open);background:color-mix(in srgb,var(--s-open) 10%,transparent);border-radius:6px;font-size:.84rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);font-weight:400}
.nav button.nv{position:relative}
.nbn{min-width:18px;height:18px;border-radius:9px;background:var(--s-open);color:#fff;font-size:.7rem;font-weight:800;display:inline-grid;place-items:center;padding:0 5px;margin-left:auto}
@media screen and (max-width:820px){.nbn{position:absolute;top:2px;left:calc(50% + 6px);margin:0}}
.aulist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;max-width:900px}
.au-day{margin:12px 2px 0;font-weight:700;font-family:var(--f-display);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.au-day:first-child{margin-top:0}
.au-day small{color:var(--moon);font-weight:500;font-family:var(--f-body)}
.au{--kc:var(--s-closed);background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--kc);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.au.k-auth{--kc:var(--s-progress)}.au.k-tkt{--kc:var(--s-resolved)}.au.k-cmt{--kc:var(--brand)}.au.k-acct{--kc:var(--s-hold)}.au.k-mail{--kc:var(--sun)}.au.k-bad{--kc:var(--s-open)}
.au .act{background:color-mix(in srgb,var(--kc) 16%,transparent);color:var(--kc);white-space:normal}
.au-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.au-top time{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums;flex:none}
.au-who{display:flex;gap:10px;align-items:center;min-width:0}
.au-who>div{min-width:0;overflow-wrap:anywhere}
.av.sm{width:32px;height:32px;font-size:.8rem;flex:none}
.au-row{display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px;font-size:.9rem;overflow-wrap:anywhere}
.au-row .lbl{color:var(--muted)}
.acf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.acf .q{grid-column:1/-1}
.acf select{min-width:0}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.pc.off{opacity:.72}
.pc-top{display:flex;gap:12px;align-items:center;min-width:0}
.pc-id{min-width:0;overflow-wrap:anywhere}
.pc-tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pc-phone{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pc-acts{display:flex;flex-wrap:wrap;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.pc-acts .btn{flex:1 1 auto}
.pc-acts .danger{color:var(--s-open)}
.pill.rp-admin{--c:var(--s-hold)}.pill.rp-technician{--c:var(--s-progress)}.pill.rp-user{--c:var(--s-closed)}
.acct-add summary{display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-family:var(--f-display);font-weight:700;font-size:1.1rem;list-style:none}
.acct-add summary::-webkit-details-marker{display:none}
.acct-add.only-m{display:none;margin-bottom:12px}
@media (max-width:1020px){.acct-add.only-m{display:block}.acct-add.only-d{display:none}.acf{grid-template-columns:repeat(2,minmax(0,1fr))}.acf select:last-child{grid-column:1/-1}}
</style>

function hex(buf){return Array.prototype.map.call(new Uint8Array(buf),function(b){return pad(b.toString(16))}).join("")}

function weakHash(pw,salt){var h=2166136261,s=salt+"|"+pw;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return "f1:"+h.toString(16)}
async function hashPw(pw,salt,ref){
 if(ref&&ref.indexOf("f1:")===0)return weakHash(pw,salt);
 try{
  var enc=new TextEncoder();
  var key=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveBits"]);
  var bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:enc.encode(salt),iterations:100000,hash:"SHA-256"},key,256);
  return "p1:"+hex(bits);
 }catch(e){return weakHash(pw,salt)}
}

function watch(q,cb,name){
 var dead=false,timer=null,slow=null,last="";
 function fail(e){S.syncErr=name+" ("+((e&&(e.code||e.message))||"error")+")";if(S.me)renderContent()}
 function deliver(sn){
  if(dead)return;
  var sig;try{sig=JSON.stringify(sn.docs.map(function(d){return [d.id,d.data()]}))}catch(x){sig=String(Math.random())}
  if(S.syncErr){S.syncErr="";if(S.me)renderContent()}
  if(sig===last)return;last=sig;cb(sn);
 }
 function pull(){if(dead)return;q.get().then(deliver).catch(fail)}
 pull();
 var un=null;
 try{un=q.onSnapshot(deliver,function(e){console.warn(e);fail(e);if(!timer)timer=setInterval(pull,15000)})}catch(e){fail(e);timer=setInterval(pull,15000)}

}

function mkBuckets(t0,t1,gran){
 var out=[],x,nx,end=noon(new Date(t1)),start=noon(new Date(t0));
 if(gran==="month"){
  x=new Date(start.getFullYear(),start.getMonth(),1,12);
  while(x<=end&&out.length<240){nx=new Date(x.getFullYear(),x.getMonth()+1,1,12);out.push({d:x,last:addDays(nx,-1),s:sod(x),e:sod(nx)-1,lab:gMS.format(x),lab2:"",full:gML.format(x)});x=nx}

  while(x<=end&&out.length<240){nx=addDays(x,7);out.push({d:x,last:addDays(nx,-1),s:sod(x),e:sod(nx)-1,lab:x.getDate()+" "+gMS.format(x),lab2:"",full:"Week of "+gD.format(x)});x=nx}

 var t0=new Date(f.getFullYear(),f.getMonth(),f.getDate()).getTime(),t1=new Date(t.getFullYear(),t.getMonth(),t.getDate(),23,59,59,999).getTime();
 var base=S.tickets.filter(function(x){
  if(r.status!=="all"&&x.status!==r.status)return false;
  if(r.prio!=="all"&&x.priority!==r.prio)return false;
  if(r.cat!=="all"&&x.category!==r.cat)return false;
  if(r.tech==="none")return !x.assignedTo;
  if(r.tech!=="all")return x.assignedTo===r.tech;
  return true;
 });
 var recv=base.filter(function(x){return x.createdAt>=t0&&x.createdAt<=t1}).sort(function(a,b){return b.createdAt-a.createdAt});
 var resolved=base.filter(function(x){return x.resolvedAt&&x.resolvedAt>=t0&&x.resolvedAt<=t1});

 var days=Math.max(1,Math.round((t1-t0)/DAY)),eff=r.gran;

 if(eff==="week"&&days>900)eff="month";
 var B=mkBuckets(t0,t1,eff);
 B.forEach(function(b){b.c=recv.filter(function(x){return x.createdAt>=b.s&&x.createdAt<=b.e}).length;b.r=resolved.filter(function(x){return x.resolvedAt>=b.s&&x.resolvedAt<=b.e}).length;b.a=attended.filter(function(x){return x.attendedAt>=b.s&&x.attendedAt<=b.e}).length});
 return {t0:t0,t1:t1,base:base,recv:recv,resolved:resolved,attended:attended,days:days,eff:eff,B:B};
}

 for(var v=0;v<=top;v+=step){var y=T+ph-v/top*ph;svg+='<line x1="'+L+'" x2="'+(W-8)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)"/><text x="'+(L-6)+'" y="'+(y+3)+'" text-anchor="end">'+v+'</text>'}

"Report a problem":"Laporkan masalah","Tap the green + button or New complaint. Write what is wrong, choose the category and the location, and say how urgent it is. Then tap Submit complaint.":"Ketik butang + hijau atau Aduan baharu. Tulis apa masalahnya, pilih kategori dan lokasi, dan nyatakan tahap kecemasannya. Kemudian ketik Hantar aduan.","Open the complaint form":"Buka borang aduan","Add photos":"Tambah foto","On the complaint form, tap Add photo to attach up to 4 pictures of the problem. Photos help the technician understand it faster.":"Pada borang aduan, ketik Tambah foto untuk melampirkan sehingga 4 gambar masalah. Foto membantu juruteknik memahaminya dengan lebih cepat.","Keep your complaint number":"Simpan nombor aduan anda","After you submit, you get a number such as SYSHHB-IT-0005 on the screen and in your email. Use it whenever you ask about your complaint.":"Selepas menghantar, anda akan mendapat nombor seperti SYSHHB-IT-0005 di skrin dan dalam e-mel anda. Gunakan nombor ini apabila bertanya tentang aduan anda.","Follow the progress":"Ikuti perkembangan","Your complaints are listed with their status: Open, In progress, On hold, Resolved or Closed. Tap a complaint to see the details, the progress and the technician handling it.":"Aduan anda disenaraikan bersama statusnya: Terbuka, Dalam proses, Ditangguhkan, Selesai atau Ditutup. Ketik aduan untuk melihat butiran, kemajuan dan juruteknik yang mengendalikannya.","Show my complaints":"Tunjukkan aduan saya","Reply to the technician":"Balas kepada juruteknik","Open a complaint and write in Add a comment, then tap Post comment. The technician sees it straight away.":"Buka aduan dan tulis di Tambah komen, kemudian ketik Hantar komen. Juruteknik akan melihatnya serta-merta.","Get notified":"Terima pemberitahuan","The bell at the top shows new updates. You also get an email when a technician updates, comments on, resolves or closes your complaint.":"Loceng di bahagian atas menunjukkan kemas kini baharu. Anda juga menerima e-mel apabila juruteknik mengemas kini, memberi komen, menyelesaikan atau menutup aduan anda.","If the problem comes back":"Jika masalah berulang","If a resolved complaint is not really fixed, open it and tap Reopen this complaint. The technicians are told immediately.":"Jika aduan yang selesai sebenarnya belum baik, buka aduan itu dan ketik Buka semula aduan ini. Juruteknik akan dimaklumkan serta-merta.","Handy settings":"Tetapan berguna","BM switches the language to Bahasa Melayu. The sun or moon switches light and dark mode. The calendar shows Gregorian and Hijri dates. To install the app, open the Edge or Chrome menu and choose Install app.":"BM menukar bahasa kepada Bahasa Melayu. Ikon matahari atau bulan menukar mod cerah dan gelap. Kalendar menunjukkan tarikh Masihi dan Hijrah. Untuk memasang aplikasi, buka menu Edge atau Chrome dan pilih Pasang aplikasi.","Open the calendar":"Buka kalendar","See what needs attention":"Lihat apa yang perlu ditangani","The dashboard shows complaints waiting, unassigned, overdue and urgent. A red banner means a complaint has waited over 1 day without a technician.":"Papan pemuka menunjukkan aduan yang menunggu, belum ditugaskan, lewat dan segera. Sepanduk merah bermaksud aduan telah menunggu lebih 1 hari tanpa juruteknik.","Open the dashboard":"Buka papan pemuka","Start work":"Mula bekerja","Open a complaint and tap Start work. It is assigned to you and the person who reported it gets an email.":"Buka aduan dan ketik Mula bekerja. Aduan ditugaskan kepada anda dan pelapor menerima e-mel.","Open the complaints":"Buka senarai aduan","Update the requester":"Kemas kini pelapor","Tap Update to change the status, progress, technician or target date, and write a message. The requester gets an email with the changes.":"Ketik Kemas kini untuk menukar status, kemajuan, juruteknik atau tarikh sasaran, dan tulis mesej. Pelapor menerima e-mel tentang perubahan itu.","Comment or internal note":"Komen atau nota dalaman","Comments are emailed to the requester. Tick Internal note to keep a message between staff only.":"Komen dihantar melalui e-mel kepada pelapor. Tandakan Nota dalaman untuk menyimpan mesej antara kakitangan sahaja.","Resolve and close":"Selesaikan dan tutup","Mark the complaint Resolved when it is fixed, then Closed when it is confirmed. The requester is emailed each time.":"Tandakan aduan sebagai Selesai apabila sudah dibaiki, kemudian Ditutup apabila disahkan. Pelapor menerima e-mel setiap kali.","Reports":"Laporan","Open Reports, choose the period and the report type, then print it or download it.":"Buka Laporan, pilih tempoh dan jenis laporan, kemudian cetak atau muat turunnya.","Open reports":"Buka laporan","Manage people":"Urus pengguna","On Accounts, new people appear automatically after their first sign-in. Search and filter, change a role or staff group with Edit, or use Disable and Delete.":"Di Akaun, orang baharu muncul secara automatik selepas log masuk kali pertama. Cari dan tapis, tukar peranan atau kumpulan kakitangan dengan Edit, atau gunakan Lumpuhkan dan Padam.","Open accounts":"Buka akaun","Check the emails":"Semak e-mel","On Accounts, tap Send a test email to me to check that email notifications are working.":"Di Akaun, ketik Hantar e-mel ujian kepada saya untuk memastikan pemberitahuan e-mel berfungsi.","Audit log":"Log audit","The Audit log records every sign-in, change, export and email, with the time and the person.":"Log audit merekodkan setiap log masuk, perubahan, eksport dan e-mel, bersama masa dan orangnya.","Open the audit log":"Buka log audit","Brunei Hijri calendar":"Kalendar Hijrah Brunei","In Calendar, open Brunei calendar settings to enter the official first day of each Hijri month.":"Di Kalendar, buka tetapan kalendar Brunei untuk memasukkan hari pertama rasmi setiap bulan Hijrah.","User guide":"Panduan pengguna","Guide":"Panduan","Using the helpdesk":"Menggunakan helpdesk","For technicians":"Untuk juruteknik","For administrators":"Untuk pe function tSum(x){
 var tail="",k=x.indexOf(". “");
 if(k>=0){tail=x.slice(k);x=x.slice(0,k)}
 return x.split(", ").map(function(p){var m;
  if(m=/^status is now (.+)$/.exec(p))return "status kini "+T(m[1]);
  if(m=/^progress is (\d+)%$/.exec(p))return "kemajuan "+m[1]+"%";
  if(m=/^assigned to (.+)$/.exec(p))return "ditugaskan kepada "+m[1];
  if(p==="unassigned")return "tidak ditugaskan";
  if(m=/^target date (.+)$/.exec(p))return "tarikh sasaran "+m[1];
  if(p==="no target date")return "tiada tarikh sasaran";
  return p}).join(", ")+tail;
}
function tEv(e){
 var m;
 if(Object.prototype.hasOwnProperty.call(MS,e))return MS[e];
 if(m=/^Status changed from (.+) to (.+)$/.exec(e))return "Status ditukar daripada "+T(m[1])+" kepada "+T(m[2]);

}

 var own=Object.prototype.hasOwnProperty;
 if(own.call(MS,s))return MS[s];
 var a=numTpl(s);
 if(a.nums.length&&own.call(MS,a.key)){var i=0;return MS[a.key].replace(/#/g,function(){return i<a.nums.length?a.nums[i++]:"#"})}

 return s;
}

function toBlob(c,q){return new Promise(function(r){c.toBlob(r,"image/jpeg",q)})}
async function shrink(file,maxDim,q,maxBytes){
 var bmp;
 try{bmp=await createImageBitmap(file)}catch(e){
  bmp=await new Promise(function(res,rej){var im=new Image();im.onload=function(){res(im)};im.onerror=rej;im.src=URL.createObjectURL(file)});
 }
 var w=bmp.width||bmp.naturalWidth,h=bmp.height||bmp.naturalHeight,sc=Math.min(1,maxDim/Math.max(w,h));
 var c=document.createElement("canvas"),ctx=c.getContext("2d"),qq=q,blob;
 function draw(){c.width=Math.max(1,Math.round(w*sc));c.height=Math.max(1,Math.round(h*sc));ctx.fillStyle="#fff";ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(bmp,0,0,c.width,c.height)}
 draw();blob=await toBlob(c,qq);
 var guard=0;
 while(maxBytes&&blob.size>maxBytes&&guard++<8){if(qq>0.45)qq-=0.1;else{sc*=0.8;draw()}blob=await toBlob(c,qq)}
 return blob;
}
function blobToDataURL(b){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result)};r.onerror=rej;r.readAsDataURL(b)})}

/* ---- Microsoft Graph calls ---- */
async function gToken(){
 var acct=msalApp.getActiveAccount()||msalApp.getAllAccounts()[0];
 try{var r=await msalApp.acquireTokenSilent({scopes:SCOPES,account:acct});return r.accessToken}
 catch(e){await msalApp.acquireTokenRedirect({scopes:SCOPES,account:acct});throw new Error("Redirecting to Microsoft…")}
}
async function gf(path,opt){
 var t=await gToken();opt=opt||{};
 opt.headers=Object.assign({Authorization:"Bearer "+t},opt.headers||{});
 return fetch(path.indexOf("http")===0?path:GR+path,opt);
}
async function gerr(r){var t="";try{t=await r.text()}catch(e){}var e=new Error("Microsoft returned "+r.status+(t?": "+t.slice(0,160):""));e.status=r.status;return e}
function ip(rel){return G.base+":/"+rel.split("/").map(encodeURIComponent).join("/")}
async function gDownload(m,name){
 if(m["@microsoft.graph.downloadUrl"]){
  try{var d=await fetch(m["@microsoft.graph.downloadUrl"],{cache:"no-store"});if(d.ok)return await d.text()}catch(e){}
 }
 var r=await gf(ip(name)+":/content");
 if(!r.ok)throw await gerr(r);
 return await r.text();
}
async function gLoad(name,force){
 var c=G.files[name];
 var r=await gf(ip(name)+"?select=id,eTag,size,@microsoft.graph.downloadUrl");
 if(r.status===404){G.files[name]={etag:null,docs:{}};return G.files[name]}
 if(!r.ok)throw await gerr(r);
 var m=await r.json();
 if(c&&c.etag===m.eTag&&!force)return c;
 var txt=await gDownload(m,name),obj={};
 try{obj=txt?JSON.parse(txt):{}}catch(e){obj={}}
 G.files[name]={etag:m.eTag,docs:obj.docs||{}};
 return G.files[name];
}
async function gSave(name,docs,etag){
 var url=ip(name)+":/content"+(etag?"":"?@microsoft.graph.conflictBehavior=fail");
 var h={"Content-Type":"application/json"};if(etag)h["If-Match"]=etag;
 var r=await gf(url,{method:"PUT",headers:h,body:JSON.stringify({docs:docs})});
 if(r.status===412||r.status===409){var e=new Error("conflict");e.conflict=true;throw e}
 if(!r.ok)throw await gerr(r);
 var m=await r.json();
 G.files[name]={etag:m.eTag,docs:docs};
}
async function gMutate(name,fn){
 for(var i=0;i<8;i++){
  var f=await gLoad(name,i>0);
  var docs=clone(f.docs),out=fn(docs);
  try{await gSave(name,docs,f.etag);notifySubs();return out}
  catch(e){if(!e.conflict)throw e;await sleep(120+Math.random()*260)}
 }
 throw new Error("Other people are saving at the same time. Please try again.");
}

}
function writeFileName(path,data){return path.split("/")[0]==="audit"?monthFile(data&&data.ts||Date.now()):filesFor(path)[0]}
function findDoc(path){var ns=filesFor(path);for(var i=0;i<ns.length;i++){var f=G.files[ns[i]];if(f&&f.docs[path])return f.docs[path]}return undefined}
function docSnap(path){var d=findDoc(path),id=path.split("/").pop();return {id:id,exists:d!==undefined,data:function(){return d===undefined?undefined:clone(d)}}}
function test(v,op,x){
 switch(op){
  case "==":return v===x;case "!=":return v!==x;
  case "<":return v<x;case "<=":return v<=x;case ">":return v>x;case ">=":return v>=x;
  case "in":return Array.isArray(x)&&x.indexOf(v)>=0;case "not-in":return Array.isArray(x)&&x.indexOf(v)<0;
  case "array-contains":return Array.isArray(v)&&v.indexOf(x)>=0;
 }
 return false;
}
function evalQuery(q){
 var pre=q.path+"/",out=[];
 filesFor(q.path).forEach(function(n){
  var f=G.files[n];if(!f)return;
  Object.keys(f.docs).forEach(function(k){
   if(k.indexOf(pre)!==0)return;var rest=k.slice(pre.length);if(rest.indexOf("/")>=0)return;
   out.push({id:rest,d:f.docs[k]});
  });
 });
 out=out.filter(function(x){return q.f.every(function(c){return test(x.d[c[0]],c[1],c[2])})});
 if(q.ord){
  var fld=q.ord[0],dir=q.ord[1]==="desc"?-1:1;
  out.sort(function(a,b){var x=a.d[fld],y=b.d[fld];if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;return x<y?-dir:x>y?dir:0});
 }else out.sort(function(a,b){return a.id<b.id?-1:1});
 if(q.lim)out=out.slice(0,q.lim);
 var docs=out.map(function(x){return {id:x.id,exists:true,data:function(){return clone(x.d)}}});
 return {docs:docs,empty:!docs.length,size:docs.length};
}

/* ---- live updates by polling ---- */
function deliverSub(sub,force){
 if(sub.dead)return;
 var isDoc=sub.q.kind==="doc",snap=isDoc?docSnap(sub.q.path):evalQuery(sub.q);
 var sig=JSON.stringify(isDoc?[snap.exists,snap.data()]:snap.docs.map(function(d){return [d.id,d.data()]}));
 if(!force&&sig===sub.sig)return;
 sub.sig=sig;
 try{sub.cb(snap)}catch(e){console.warn(e)}
}
function notifySubs(){G.subs.slice().forEach(function(s){deliverSub(s,false)})}
async function pollAll(){
 if(document.hidden||G.polling||!G.subs.length)return;
 G.polling=true;
 try{
  var names={};
  G.subs.forEach(function(s){filesFor(s.q.path).forEach(function(n){names[n]=1})});
  for(var n in names)await gLoad(n);
  notifySubs();
 }catch(e){console.warn(e)}finally{G.polling=false}
}
function startPoll(){
 if(G.timer)return;
 G.timer=setInterval(pollAll,(CFG.POLL_SECONDS||10)*1000);
 document.addEventListener("visibilitychange",function(){if(!document.hidden)pollAll()});
}
function subscribe(q,cb,err){
 var sub={q:q,cb:cb,sig:null,dead:false};
 G.subs.push(sub);startPoll();
 (async function(){
  try{var ns=filesFor(q.path);for(var i=0;i<ns.length;i++){if(!G.files[ns[i]])await gLoad(ns[i])}deliverSub(sub,true)}
  catch(e){if(err)err({code:"unavailable",message:e.message});else console.warn(e)}
 })();
 return function(){sub.dead=true;G.subs=G.subs.filter(function(x){return x!==sub})};
}

/* ---- the small database the page uses ---- */
function writeDoc(path,mut,data){
 return gMutate(writeFileName(path,data),function(docs){
  var out=mut(docs);
  if(path.split("/")[0]==="notifs"){
   var ks=Object.keys(docs);
   if(ks.length>400){ks.sort(function(a,b){return (docs[a].ts||0)-(docs[b].ts||0)});ks.slice(0,ks.length-400).forEach(function(k){delete docs[k]})}
  }
  return out;
 });
}
async function rawRead(dir,id){
 var rel=dir+"/"+id+".json";
 var r=await gf(ip(rel)+"?select=id,@microsoft.graph.downloadUrl");
 if(r.status===404)return undefined;
 if(!r.ok)throw await gerr(r);
 var m=await r.json(),txt=await gDownload(m,rel);
 try{return JSON.parse(txt)}catch(e){return undefined}
}
function rawRef(dir,path){
 var id=path.split("/").pop(),rel=dir+"/"+id+".json";
 return {path:path,id:id,
  get:async function(){var d=await rawRead(dir,id);return {id:id,exists:d!==undefined,data:function(){return d}}},
  set:async function(d){
   var r=await gf(ip(rel)+":/content",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)});
   if(!r.ok)throw await gerr(r);
  },
  update:async function(){},
  delete:async function(){await gf(ip(rel),{method:"DELETE"})},
  acquire:async function(){return {acquired:true}}
 };
}
function mkRef(path){
 if(path.indexOf("images/")===0)return rawRef("photos",path);
 if(path.indexOf("outbox/")===0)return rawRef("outbox",path);
 var id=path.split("/").pop();
 return {path:path,id:id,kind:"doc",
  get:async function(){await gLoad(filesFor(path)[0]);return docSnap(path)},
  set:function(d){var c=clone(d);return writeDoc(path,function(docs){docs[path]=c},d)},
  update:function(p){var c=clone(p);return writeDoc(path,function(docs){docs[path]=Object.assign({},docs[path]||{},c)},p)},
  delete:function(){return writeDoc(path,function(docs){delete docs[path]},null)},
  acquire:async function(){return {acquired:true}},
  onSnapshot:function(cb,err){return subscribe({kind:"doc",path:path},cb,err)},
  collection:function(sub){return mkCol(path+"/"+sub,[],null,0)}
 };
}
function mkCol(path,f,ord,lim){
 var q={kind:"query",path:path,f:f,ord:ord,lim:lim};
 return {path:path,kind:"query",f:f,ord:ord,lim:lim,
  where:function(a,op,v){return mkCol(path,f.concat([[a,op,v]]),ord,lim)},
  orderBy:function(a,d){return mkCol(path,f,[a,d||"asc"],lim)},
  limit:function(n){return mkCol(path,f,ord,n)},
  get:async function(){var ns=filesFor(path);for(var i=0;i<ns.length;i++)await gLoad(ns[i]);return evalQuery(q)},
  onSnapshot:function(cb,err){return subscribe(q,cb,err)},
  doc:function(id){return mkRef(path+"/"+(id||rid()))},
  add:async function(d){var ref=mkRef(path+"/"+rid());await ref.set(d);return ref}
 };
}
function makeDb(){
 return {
  doc:mkRef,
  collection:function(p){return mkCol(p,[],null,0)},
  increment:function(path,field){
   return writeDoc(path,function(docs){var d=docs[path]||{};d[field]=(+d[field]||0)+1;docs[path]=d;return d[field]},null);
  }
 };
}

 if(CFG.DRIVE_ID&&CFG.FOLDER_ID){

 }

 var name=CFG.FOLDER_NAME||"SYSHHB-Helpdesk",enc=encodeURIComponent(name);

async function afterLogin(acct){
 var email=String(acct.username||"").toLowerCase(),name=acct.name||email;

 if(dom&&email.slice(email.lastIndexOf("@")+1)!==dom){
  fatal("This page is only for @"+dom+" accounts. You signed in as "+email+".","Wrong account");return;
 }
 try{
  await resolveStorage(email);
  S.db=makeDb();
  var myMail=email;
  try{var meR=await gf("/me?$select=mail,userPrincipalName");if(meR.ok){var mj=await meR.json();myMail=String(mj.mail||mj.userPrincipalName||email).toLowerCase()}}catch(e){console.warn(e)}

  var snap=await S.db.doc("accounts/"+email).get();
  if(!snap.exists){S.pending={email:email,name:name,mail:myMail};S.loading=false;render();return}
  var a=snap.data();
  if(a.mail!==myMail){a.mail=myMail;try{await S.db.doc("accounts/"+email).update({mail:myMail})}catch(e){console.warn(e)}}
  if(a.active!==false&&(!a.phone||!a.dept)){S.pending={email:email,name:a.name||name,mail:myMail,dept:a.dept||"",phone:a.phone||"",existing:true};S.loading=false;render();return}
  if(a.active===false){fatal("This account is disabled. Ask an administrator to enable it.","Account disabled");return}
  S.loading=false;

  var k="hd.logged."+email;

 }catch(e){console.warn(e);fatal(e.message||"Something went wrong while connecting.","Can’t connect")}

function htmlToText(h){
 h=String(h||"").replace(/<br\s*\/?>/gi,"\n").replace(/<\/(p|div|tr|li|h\d|table|blockquote)>/gi,"\n").replace(/<hr[^>]*>/gi,"\n______________\n");

function replyPart(text){
 var lines=String(text||"").split("\n"),out=[];
 var stop=[/^\s*(from|dari|daripada|sent|dihantar)\s*:/i,/^\s*on .{4,}wrote:\s*$/i,/wrote:\s*$/i,/^\s*pada .{4,}menulis:\s*$/i,/original message/i,/^\s*_{6,}/,/^\s*-{6,}/,/^\s*>/,/SYSHHB IT Helpdesk/i,/^\s*get outlook for/i,/^\s*sent from my/i];
 for(var i=0;i<lines.length;i++){var l=lines[i];if(stop.some(function(r){return r.test(l)}))break;out.push(l)}
 return out.join("\n").replace(/\n{3,}/g,"\n\n").trim().slice(0,4000);
}

async function processInbox(){
 if(!S.me||!isStaff()||S.inboxBusy||!S.db)return;
 S.inboxBusy=true;
 try{
  var r=await gf(ip("inbox")+":/children?$top=50");
  if(!r.ok)return;
  var list=(await r.json()).value||[];
  for(var i=0;i<list.length;i++){
   var f=list[i];if(!f.file||!/\.json$/i.test(f.name))continue;
   var txt;
   try{txt=await gDownload(f,"inbox/"+f.name)}catch(e){continue}
   var m;try{m=JSON.parse(txt)}catch(e){m=null}
   var del=async function(){var d=await gf(ip("inbox/"+f.name),{method:"DELETE"});return d.ok||d.status===404};
   if(!m){await del();continue}
   var subj=String(m.subject||""),from=m.from&&m.from.emailAddress?m.from.emailAddress.address:m.from;
   from=String(from||"").toLowerCase().replace(/^.*<|>.*$/g,"");
   if(/^\s*((re|fw|fwd):\s*)*\[alert\]/i.test(subj)){await del();continue}
   var idm=subj.match(/SYSHHB-IT-\d{4,}|\d{4,}-IT-SYSHHB/i);
   var t=idm?findTicketByAnyId(idm[0].toUpperCase()):null;
   if(!t){if(S.tickets.length){await del();log("email.ignored",idm?idm[0]:"","No matching complaint for reply from "+from)}continue}
   var acct=S.accounts.filter(function(a){return a.username===from||a.mail===from})[0]||null;
   var requester=[String(t.createdBy||"").toLowerCase(),String(t.createdByMail||"").toLowerCase(),String(addrFor(t)||"").toLowerCase()].indexOf(from)>=0;
   var staffSender=acct&&(acct.role==="technician"||acct.role==="admin");
   if(!requester&&!staffSender){await del();log("email.ignored",t.id,"Reply from "+from+" is not the requester or staff");continue}
   var body=replyPart(m.isHtml===false?String(m.body||""):htmlToText(m.body||m.bodyPreview||""));
   if(!body){await del();continue}
   var ts=Date.parse(m.receivedDateTime||"")||Date.now(),who=acct?acct.name:(requester?t.createdByName:from);
   var role=acct?acct.role:"user",by=acct?acct.username:t.createdBy;
   await S.db.doc("tickets/"+t.id+"/comments/em-"+f.id.replace(/[^A-Za-z0-9_-]/g,"")).set({type:"comment",text:body,by:by,byName:who,role:role,ts:ts,internal:false,via:"email"});
   await S.db.doc("tickets/"+t.id).update({updatedAt:Date.now(),lastActAt:Date.now(),lastActBy:by,lastActByName:who,lastActKind:"email",lastActText:body.slice(0,140),lastActInternal:false});
   var snip=body.length>80?body.slice(0,80)+"…":body;
   if(staffSender&&!requester){mailSafe("comment",t,{by:who,msg:body})}
   else await S.db.doc("notifs/em-"+f.id.replace(/[^A-Za-z0-9_-]/g,"")).set({ts:Date.now(),to:t.assignedTo||"staff",text:who+" replied by email on "+t.id+": "+snip,ticketId:t.id,kind:"comment",by:"email",byName:who});
   if(await del())log("comment.email",t.id,from+": "+snip);
  }
 }catch(e){console.warn("inbox",e)}
 finally{S.inboxBusy=false}
}

  '<button class="btn primary send" aria-label="Send"'+(S.busy?" disabled":"")+'>'+ico("send")+'</button></div>'+(reopen?'<div>'+reopen+'</div>':'')+'</form>';
}

/* ============ "new activity" indicators on complaint cards ============ */
function seenMap(){
 if(!S.me)return {_base:0};
 if(!S.seenT||S.seenT._u!==S.me.username){
  var k="hd.seenT."+S.me.username,m=null;
  try{m=JSON.parse(ls.get(k)||"null")}catch(e){m=null}
  if(!m){m={_base:Date.now()};ls.set(k,JSON.stringify(m))}
  m._u=S.me.username;S.seenT=m;
 }
 return S.seenT;
}
function markSeen(id){if(!S.me||!id)return;var m=seenMap();m[id]=Date.now();try{ls.set("hd.seenT."+S.me.username,JSON.stringify(m))}catch(e){}}
function unseen(t){
 if(!S.me||!t||!t.lastActAt||t.lastActBy===S.me.username)return false;
 if(t.lastActInternal&&!isStaff())return false;
 var m=seenMap(),s=m[t.id]||m._base||0;
 return t.lastActAt>s;
}
function lastActPatch(kind,text,internal){return {lastActAt:Date.now(),lastActBy:S.me.username,lastActByName:S.me.name,lastActKind:kind,lastActText:String(text||"").slice(0,140),lastActInternal:!!internal}}
function newBadge(t){
 if(!unseen(t))return "";
 var lab=t.lastActKind==="created"?"New complaint":t.lastActKind==="update"?"Updated":t.lastActKind==="email"?"New reply by email":"New reply";
 return '<span class="nbadge"><i></i>'+lab+'</span>';
}
function newSnip(t){
 if(!unseen(t)||!t.lastActText||t.lastActKind==="created")return "";
 return '<span class="nsnip" translate="no"><b>'+esc(t.lastActByName||"")+':</b> '+esc(t.lastActText)+'</span>';
}
function navBadge(){var n=S.tickets.filter(unseen).length;return n?'<span class="nbn" translate="no">'+(n>99?"99+":n)+'</span>':""}

/* ============ audit log as readable cards ============ */
function auditKind(a){
 var x=String(a.action||"");
 if(/failed|ignored/.test(x))return "bad";
 if(x.indexOf("auth.")===0)return "auth";
 if(x.indexOf("account.")===0||x.indexOf("settings.")===0)return "acct";
 if(x.indexOf("email.")===0)return "mail";
 if(x.indexOf("comment.")===0||x==="update.message")return "cmt";
 if(x.indexOf("ticket.")===0)return "tkt";
 return "other";
}
var AUDIT_TYPES=[["all","All activity"],["auth","Sign-ins"],["tkt","Complaint changes"],["cmt","Comments"],["acct","Accounts and settings"],["mail","Emails"],["bad","Problems"],["other","Exports"]];
function auditCards(list){
 var out="",day="",today=todayKey(),yest=ymd(addDays(noon(new Date()),-1));
 list.forEach(function(a){
  var d=new Date(a.ts),k=ymd(d);
  if(k!==day){day=k;out+='<li class="au-day"><span>'+(k===today?"Today":k===yest?"Yesterday":esc(fmtG(a.ts)))+'</span>'+(hOK?'<small translate="no">'+esc(fmtH(a.ts))+'</small>':'')+'</li>'}
  var kind=auditKind(a),who=a.actorName||a.actor||"",tk=(a.target&&/IT-SYSHHB|SYSHHB-IT/i.test(a.target))?findTicketByAnyId(String(a.target).toUpperCase()):null;
  out+='<li class="au k-'+kind+'"><div class="au-top"><span class="act">'+esc(ACTIONS[a.action]||a.action)+'</span><time translate="no">'+tF.format(d)+'</time></div>'+
   '<div class="au-who"><span class="av sm" style="background:'+avColor(who)+'" aria-hidden="true">'+esc(initials(who))+'</span><div><b translate="no">'+esc(who)+'</b>'+(ROLES[a.role]?' <span class="muted small">'+esc(ROLES[a.role])+'</span>':'')+(a.actor&&a.actor!==who?'<div class="muted small" translate="no">'+esc(a.actor)+'</div>':'')+'</div></div>'+
   (a.target?'<div class="au-row"><span class="lbl">Target</span>'+(tk?'<span><button class="link" data-act="open" data-id="'+esc(tk.id)+'" translate="no">'+esc(fmtIds(a.target))+'</button></span>':'<span translate="no">'+esc(fmtIds(a.target))+'</span>')+'</div>':'')+
   (a.detail?'<div class="au-row"><span class="lbl">Details</span><span translate="no">'+esc(fmtIds(a.detail))+'</span></div>':'')+'</li>';
 });
 return out;
}

document.addEventListener("toggle",function(e){var t=e.target;if(t&&t.id&&/^acctwrap/.test(t.id))S.acctFormOpen=t.open},true);

function signinText(){
 var d=String(CFG.ALLOWED_DOMAIN||"syayasan.edu.bn");
 return LANG==="ms"?"Gunakan e-mel sekolah anda (@"+d+") untuk membuat laporan masalah atau mengurus aduan.":"Use your school email (@"+d+") to report a problem or manage complaints.";
}

/* ============ email the helpdesk team about user activity ============ */
function staffRecipients(t){
 var base=(CFG.NOTIFY_EMAILS&&CFG.NOTIFY_EMAILS.length?CFG.NOTIFY_EMAILS:CFG.ADMIN_EMAILS)||[];
 var list=base.slice();
 var tech=String(t.assignedMail||t.assignedTo||"");
 if(/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(tech))list.push(tech);
 var me=S.me?[String(S.me.mail||"").toLowerCase(),String(S.me.username||"").toLowerCase()]:[],seen={},out=[];
 list.forEach(function(x){x=String(x).toLowerCase();if(!x||seen[x]||me.indexOf(x)>=0)return;seen[x]=1;out.push(x)});
 return out;
}
function mailStaff(kind,t,o){
 try{
  if(MAILMODE==="off")return;
  var to=staffRecipients(t);
  if(!to.length)return;
  var m=buildMail(kind,t,o||{});
  sendMail(to,m.subject,m.html).then(function(){
   log("email.sent",t.id,to.join(", ")+" ("+kind+", "+MAILMODE+")");
  }).catch(function(e){
   console.warn("staff email failed",e);
   log("email.failed",t.id,to.join(", ")+": "+String((e&&e.message)||e).slice(0,200));
  });
 }catch(e){console.warn(e)}
}

/* ============ touch: swipe month, swipe sheet down ============ */
var tx=0,ty=0,tt=null;
document.addEventListener("touchstart",function(e){var t=e.touches[0];tx=t.clientX;ty=t.clientY;tt=e.target},{passive:true});
document.addEventListener("touchend",function(e){
 if(!tt)return;var t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty,el=tt;tt=null;
 var sh=el.closest&&el.closest(".sheet.open,.bellpanel");
 if(sh){if(dy>80&&Math.abs(dx)<60&&sh.scrollTop<=0){if(S.bell){S.bell=false;renderChrome()}else{S.sheet=false;render()}buzz(6)}return}
 var c=el.closest&&el.closest(".cal");
 if(c&&!S.sheet&&Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){(dx<0?A.calnext:A.calprev)();buzz(10)}
},{passive:true});

/* ============ start ============ */
async function init(){
 var th=ls.get("hd.theme");if(th)document.documentElement.dataset.theme=th;
 document.documentElement.lang=LANG==="ms"?"ms":"en";
 document.documentElement.style.setProperty("--logo","url("+LOGO+")");
 var ic=document.createElement("link");ic.rel="icon";ic.href=LOGO;document.head.appendChild(ic);
 S.loading=true;render();
 try{
  var acct=await msInit();
  if(!acct){S.loading=false;render();return}
  await afterLogin(acct);
 }catch(e){console.warn(e);fatal(e.message||"Something went wrong while starting.","Can’t start")}
}
init();
})();
